merge_protections:
  - name: Enforce conventional commit {{7*7}}
    description: Make sure that we follow {{7*7}}
    if:
      - base = main
    success_conditions:
      - "title ~=
        ^(fix|feat|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\\(.+\
        \\))?:"
merge_protections_settings:
  auto_merge_conditions: true
